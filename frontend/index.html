<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncRoom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>SyncRoom</h1>
    <p>Anonymous, temporary chat rooms.</p>
  </header>

  <main>
    <section id="create-room-section">
      <h2>Create a Room</h2>
      <button id="create-room-button">Create Room</button>
      <div id="room-result"></div>
    </section>

    <section id="check-room-section">
      <h2>Check a Room Code</h2>
      <form id="check-room-form">
        <label for="room-code-input">Room code:</label>
        <input type="text" id="room-code-input" required>
        <button type="submit">Check</button>
      </form>
      <div id="check-room-result"></div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
